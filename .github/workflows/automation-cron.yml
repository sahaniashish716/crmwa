# Backup drain for Wait steps + time-based automations (Vercel Hobby).
#
# GitHub scheduled workflows are NOT every minute in practice — runs can be
# delayed by hours and overlap. For reliable 1-minute pings use cron-job.org
# (see docs/automation-cron.md). Keep this workflow as a secondary safety net.
#
# Secrets: CRM_CRON_BASE_URL, AUTOMATION_CRON_SECRET
name: Automation cron drain

on:
  schedule:
    # GitHub minimum / typical cadence for scheduled workflows (~5 minutes).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: automation-cron-drain
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call automation cron endpoint
        env:
          BASE_URL: ${{ secrets.CRM_CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set CRM_CRON_BASE_URL and AUTOMATION_CRON_SECRET repo secrets."
            exit 0
          fi
          URL="${BASE_URL%/}/api/automations/cron"
          for attempt in 1 2 3; do
            if curl -sfS --connect-timeout 20 --max-time 90 \
              -H "x-cron-secret: $CRON_SECRET" "$URL"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "All attempts failed"
          exit 1
